version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    open-pull-requests-limit: 5
    ignore:
      # Deliberate pins (see docs/ARCHITECTURE.md). Revisit when the tooling supports them:
      # TypeScript 7 is outside typescript-eslint's supported range,
      # ESLint 10 is not yet supported by eslint-config-next's plugins,
      # @types/node follows the Node.js 22 runtime used in Docker and CI.
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
  - package-ecosystem: docker
    directory: /
    schedule: { interval: weekly }
