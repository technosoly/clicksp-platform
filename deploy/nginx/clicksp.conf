# nginx in front of the Clicksp app container (which listens on 127.0.0.1:3000).
# Copy to /etc/nginx/sites-available/clicksp, replace example.ir with the real
# domain, link it into sites-enabled, then get a certificate (see
# docs/DEPLOYMENT.md, "Going live"). nginx comes from the distribution's own
# package repository, so no Docker Hub pull is needed for it.

limit_req_zone $binary_remote_addr zone=clicksp_req:10m rate=10r/s;

server {
    listen 80;
    listen [::]:80;
    server_name example.ir www.example.ir;
    # Certificate challenges, then everything else to HTTPS.
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 301 https://example.ir$request_uri; }
}

server {
    # "http2" on the listen line works on nginx 1.24 (Ubuntu 24.04); newer versions also accept "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name www.example.ir;
    ssl_certificate     /etc/letsencrypt/live/example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ir/privkey.pem;
    return 301 https://example.ir$request_uri;
}

server {
    # "http2" on the listen line works on nginx 1.24 (Ubuntu 24.04); newer versions also accept "http2 on;".
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name example.ir;

    ssl_certificate     /etc/letsencrypt/live/example.ir/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/example.ir/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;

    # The app sends its own security headers and Content-Security-Policy;
    # don't add a second CSP here.
    server_tokens off;
    client_max_body_size 1m;
    # Many mobile customers share one address (carrier NAT), so only page and
    # API requests are rate limited, not built assets or images. Sign-in and
    # code limits are enforced by the app itself.
    limit_req_status 429;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml application/xml;

    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Request-Id $request_id;
    # Overwrite (never append to) the client address the app trusts (TRUSTED_IP_HEADER=x-real-ip).
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60s;

    # Admins upload photos and CSV files (the app's own limit is 11 MB).
    location ~ ^/(fa|en)/admin(/|$) {
        client_max_body_size 11m;
        limit_req zone=clicksp_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }

    # Built assets and uploaded images are immutable; cache them at the edge.
    location /_next/static/ {
        proxy_pass http://127.0.0.1:3000;
        expires 365d;
        access_log off;
    }
    location /media/ {
        proxy_pass http://127.0.0.1:3000;
        access_log off;
    }

    location / {
        limit_req zone=clicksp_req burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000;
    }
}
