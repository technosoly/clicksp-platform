# Local development and single-server deployment stack.
# Development services only:     docker compose up -d postgres redis meilisearch
# Full stack including the app:  docker compose --profile app up -d --build
# Secrets come from .env (copy .env.example); nothing secret is hardcoded here.
# Uploaded images are kept in the media-data volume (MEDIA_STORAGE_DIR); back it
# up with the database. An S3-compatible store can replace it later.

name: clicksp

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-clicksp}
      POSTGRES_USER: ${POSTGRES_USER:-clicksp}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["sh", "-c", "exec redis-server --appendonly yes --requirepass \"$${REDIS_PASSWORD}\""]
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?Set REDIS_PASSWORD in .env}
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$${REDIS_PASSWORD}\" --no-auth-warning ping | grep -q PONG"]
      interval: 5s
      timeout: 5s
      retries: 20

  meilisearch:
    image: getmeili/meilisearch:v1.58.0
    restart: unless-stopped
    environment:
      MEILI_ENV: ${MEILI_ENV:-development}
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY:?Set MEILI_MASTER_KEY in .env (at least 16 bytes)}
      MEILI_NO_ANALYTICS: "true"
    ports:
      - "127.0.0.1:${MEILI_PORT:-7700}:7700"
    volumes:
      - meili-data:/meili_data
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:7700/health || wget -qO- http://127.0.0.1:7700/health"]
      interval: 10s
      timeout: 5s
      retries: 10

  migrate:
    profiles: ["app"]
    build:
      context: .
      target: migrate
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-clicksp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clicksp}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  app:
    profiles: ["app"]
    build:
      context: .
      target: runtime
    restart: unless-stopped
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_URL: ${APP_URL:-http://localhost:3000}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      SITE_INDEXING: ${SITE_INDEXING:-false}
      TRUSTED_IP_HEADER: ${TRUSTED_IP_HEADER:-x-real-ip}
      PAYMENT_PROVIDERS: ${PAYMENT_PROVIDERS:-}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET in .env (openssl rand -base64 48)}
      SMS_PROVIDER: ${SMS_PROVIDER:-none}
      DATABASE_URL: postgresql://${POSTGRES_USER:-clicksp}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-clicksp}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      MEILISEARCH_HOST: http://meilisearch:7700
      # A scoped key (see docs/DEPLOYMENT.md); falls back to the master key for local runs.
      MEILISEARCH_API_KEY: ${MEILISEARCH_APP_KEY:-${MEILI_MASTER_KEY}}
      MEDIA_STORAGE_DIR: /app/.data/media
    volumes:
      - media-data:/app/.data/media
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      meilisearch:
        condition: service_healthy

volumes:
  postgres-data:
  redis-data:
  meili-data:
  media-data:
